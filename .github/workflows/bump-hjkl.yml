name: Bump hjkl formula

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "hjkl release tag to pin (e.g. v0.3.2)"
        required: true
        type: string

concurrency:
  group: bump-hjkl-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  bump:
    name: Render Formula/hjkl.rb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Validate tag exists
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::invalid tag format: $TAG (expected vX.Y.Z[-suffix])"
            exit 1
          fi
          if ! curl -fsSI "https://api.github.com/repos/kryptic-sh/hjkl/releases/tags/${TAG}" >/dev/null; then
            echo "::error::release ${TAG} not found at kryptic-sh/hjkl"
            exit 1
          fi

      - name: Render formula
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          VERSION="${TAG#v}"
          BASE="https://github.com/kryptic-sh/hjkl/releases/download/${TAG}"
          fetch_sha() {
            local tgt=$1
            local url="${BASE}/hjkl-${TAG}-${tgt}.tar.gz"
            for i in 1 2 3 4 5; do
              if curl -fsSL -o "${tgt}.tar.gz" "$url"; then
                sha256sum "${tgt}.tar.gz" | cut -d' ' -f1
                return 0
              fi
              echo "::warning::fetch ${url} attempt ${i} failed, retrying"
              sleep 10
            done
            echo "::error::failed to fetch ${url} after 5 attempts"
            return 1
          }
          SHA_AARCH64_APPLE_DARWIN=$(fetch_sha aarch64-apple-darwin)
          SHA_X86_64_APPLE_DARWIN=$(fetch_sha x86_64-apple-darwin)
          SHA_X86_64_UNKNOWN_LINUX_GNU=$(fetch_sha x86_64-unknown-linux-gnu)
          SHA_AARCH64_UNKNOWN_LINUX_GNU=$(fetch_sha aarch64-unknown-linux-gnu)
          mkdir -p Formula
          cat > Formula/hjkl.rb <<EOF
          class Hjkl < Formula
            desc "Vim-modal terminal editor: standalone TUI built on the hjkl engine"
            homepage "https://hjkl.kryptic.sh"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/kryptic-sh/hjkl/releases/download/v#{version}/hjkl-v#{version}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_AARCH64_APPLE_DARWIN}"
              else
                url "https://github.com/kryptic-sh/hjkl/releases/download/v#{version}/hjkl-v#{version}-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_X86_64_APPLE_DARWIN}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/kryptic-sh/hjkl/releases/download/v#{version}/hjkl-v#{version}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_X86_64_UNKNOWN_LINUX_GNU}"
              end
              on_arm do
                url "https://github.com/kryptic-sh/hjkl/releases/download/v#{version}/hjkl-v#{version}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_AARCH64_UNKNOWN_LINUX_GNU}"
              end
            end

            def install
              bin.install "hjkl"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/hjkl --version")
            end
          end
          EOF

      - name: Commit + push
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet Formula/hjkl.rb; then
            echo "::notice::no changes — formula already at ${TAG}"
            exit 0
          fi
          git add Formula/hjkl.rb
          git commit -m "hjkl ${TAG#v}"
          git push
